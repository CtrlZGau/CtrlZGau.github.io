# Site
title: Gautham Balachandran — Robotics
tagline: Robotics researcher — manipulation, imitation learning, VLA
description: >-
  Gautham Balachandran — robotics researcher at BITS Pilani. Taking learned
  manipulation policies from training runs to real hardware, currently on a
  humanoid at Manav Robotics.
url: "https://ctrlzgau.github.io"
baseurl: ""
lang: en
timezone: Asia/Kolkata

author: Gautham Balachandran
email: gauthamgb85@gmail.com
github_url: https://github.com/CtrlZGau
linkedin_url: https://www.linkedin.com/in/gautham-balachandran-robotics/
cv_url: /assets/cv.pdf

# Build
# Show posts dated ahead of today, so dropping in a file always publishes it.
future: true

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /log/:title/

exclude:
  - design-reference
  - vendor
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .replit
  - .env.example
